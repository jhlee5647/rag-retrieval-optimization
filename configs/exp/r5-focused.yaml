# 라운드 5의 후보. r4-expand-select-chunks에서 답 프롬프트만 바꿨다.
# "빠짐없이"는 그대로 두고, 배경 설명과 묻지 않은 사실, 출처와 문맥에 없는 것에 대한 언급을 덧붙이지 말라고 적었다.
# 정답보다 훨씬 긴 답의 점수가 낮은 것을 겨냥한다. 검색은 그대로다.
index: {url: http://127.0.0.1:6333, exact: true}
chunking: {size: 512, overlap: 64}
embedding:
  base_url: http://127.0.0.1:8003/v1
  model: Qwen/Qwen3-Embedding-4B
  revision: 5cf2132abc99cad020ac570b19d031efec650f2b
  max_input_tokens: 8192
  query_instruction: Given a web search query, retrieve relevant passages that answer the query
eval:
  fields: {id: id, question: question, answer: reference, doc_ids: expected_doc_ids, type: type}
  k: [1, 5]
retrieve:
  - expand:
      # 틀마다 검색어 4개를 만든다. 앞의 것은 질문이 묻는 정보 조각마다, 뒤의 것은 문서가 쓸 법한 다른 말로 쓴다.
      queries: [prompts/expand-facets.txt, prompts/expand-paraphrase.txt]
      passage: prompts/expand-passage.txt
      # 가상의 글을 쓸 문서 종류. 틀의 {style}에 들어간다.
      styles:
        - a Slack channel conversation (a few short messages from different people)
        - a meeting transcript (speakers discussing the matter in spoken language)
        - an email between colleagues or with a customer
        - an engineering ticket or pull request description (Jira, Linear or GitHub)
  - search: {mode: multi, candidates: 100, docs: 150}
  - rerank: {top_k: 40, dedup: true, prior_weight: 0.5}
  - select: {prompt: prompts/select.txt, top_k: 5, doc_chunks: 16}
rerank:
  base_url: http://127.0.0.1:8004/v1
  model: BAAI/bge-reranker-v2-m3
  revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
generation:
  base_url: http://127.0.0.1:8001/v1
  model: Qwen/Qwen3.8-27B-FP8
  revision: c3a462cc3d38cf351f3b26cbd763469eeb74ef81
  max_model_len: 32768
  max_tokens: 1024
  temperature: 0
generate:
  - answer: {prompt: prompts/answer-focused.txt}
judge:
  base_url: http://127.0.0.1:8002/v1
  model: RedHatAI/gemma-4-26B-A4B-it-NVFP4
  revision: 5557756b8dce33ac72f2bd702b11729fdba3b839
