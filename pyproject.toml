[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "qdrant-client>=1.20.0",
    "ragas>=0.4.4",
    "tokenizers>=0.23.3",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff 기본 규칙(E4, E7, E9, F)에 import 정렬(I)만 더한다.
extend-select = ["I"]
